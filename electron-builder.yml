appId: com.thelasttrain.game
productName: The Last Train
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - LICENSE
  - '!node_modules/**/*'
extraResources:
  - from: build/font-licenses
    to: licenses/fonts
mac:
  category: public.app-category.adventure-games
  icon: build/icon.png
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: The-Last-Train-${version}-mac-${arch}.${ext}
dmg:
  title: The Last Train
  icon: build/icon.png
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 170
    - x: 390
      y: 170
      type: link
      path: /Applications
