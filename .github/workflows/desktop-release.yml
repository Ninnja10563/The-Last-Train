name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  macos:
    name: Build and test macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            app: release/mac-arm64/The Last Train.app/Contents/MacOS/The Last Train
          - arch: x64
            runner: macos-15-intel
            app: release/mac/The Last Train.app/Contents/MacOS/The Last Train
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v'+require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm test
      - run: npm run build
      - name: Build DMG
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify application signature
        run: codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname '${{ matrix.app }}')")")"
      - name: Test the packaged application
        run: npm run test:desktop
        env:
          DESKTOP_EXECUTABLE: ${{ github.workspace }}/${{ matrix.app }}
      - name: Verify disk image
        run: hdiutil verify release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  publish:
    name: Publish verified DMGs
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum *.dmg > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.dmg release/SHA256SUMS.txt --verify-tag --title "THE LAST TRAIN $RELEASE_TAG — macOS" --notes-file build/release-notes.md
